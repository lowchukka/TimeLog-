x:4}.nav button{font-size:12px;background:transparent;color:var(--muted);padding:8px 2px}.nav button.sel{color:#a6c9ff;background:#273a55}.nav b{display:block;font-size:19px;margin-bottom:4px}.sync{font-size:12px;margin:14px 0;color:var(--green)}.error{color:var(--red);white-space:pre-wrap}.hidden{display:none!important}label{display:block;margin:12px 0 5px;color:var(--muted);font-size:13px}input,select,textarea{width:100%;min-width:0;background:#111827;color:#fff;border:1px solid #49566a;border-radius:10px;padding:12px;font:16px -apple-system,sans-serif;min-height:44px}textarea{min-height:75px}#overlay{position:fixed;inset:0;background:#111827;z-index:6;overflow:auto;padding:22px 18px 60px}.pill{font-size:12px;color:var(--blue)}.sub{font-size:13px;line-height:1.45}.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0}.month button{min-width:46px}.calendar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.calendar button{padding:6px 0;background:#2c3749;min-height:48px;font-size:13px}.calendar .ok{background:#24543e}.calendar .off{background:#202936;color:#91a0b7}.calendar .picked{outline:2px solid #91baff}.calendar small{display:block;font-size:9px;margin-top:4px}.footer{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}

html{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}body{max-width:720px;margin:0 auto;padding:22px 16px calc(110px + env(safe-area-inset-bottom,0px));overflow-wrap:anywhere}main,header,.card,.grid>*{min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.calendar{grid-template-columns:repeat(5,minmax(0,1fr))}.row>*{min-width:0}.listrow>span:first-child{flex:1;min-width:0}.listrow>span:last-child,.listrow>strong{flex-shrink:0}.num{font-size:clamp(18px,5.7vw,26px)}.nav{grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}.nav button{min-width:0;font-size:clamp(10px,3vw,12px)}#overlay{padding:20px 16px calc(90px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}input[type=datetime-local],input[type=date],input[type=time]{display:block;max-width:100%;-webkit-appearance:none}input::-webkit-date-and-time-value{text-align:left}input[type=checkbox]{appearance:auto;-webkit-appearance:checkbox;width:22px;min-height:22px;flex:none;accent-color:#34d399}.check{display:flex;align-items:center;gap:9px;font-size:14px}.confirmbox{border:1px solid #a34c57;border-radius:12px;padding:12px;margin-top:10px}.card .row strong{text-align:right}@media(max-width:350px){body{padding-left:10px;padding-right:10px}.card{padding:12px}.calendar{gap:2px}.calendar button{font-size:12px}.calendar small{font-size:8px}}
